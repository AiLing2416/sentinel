app-id: io.github.ailing2416.sentinel
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: sentinel
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=ssh-auth
  - --device=dri
  - --device=all
  - --filesystem=xdg-config/sentinel:create
  - --filesystem=xdg-run/app/io.github.ailing2416.sentinel:create
  - --talk-name=org.gtk.vfs.*
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=xdg-config/fontconfig:ro
  - --filesystem=~/.local/share/fonts:ro
  - --filesystem=~/.fonts:ro
  - --filesystem=/usr/share/fonts:ro

modules:
  - name: rclone
    buildsystem: simple
    build-commands:
      - install -D rclone /app/bin/rclone
    sources:
      - type: archive
        url: https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-linux-amd64.zip
        sha256: 349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702
        strip-components: 1
        only-arches: [x86_64]
      - type: archive
        url: https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-linux-arm64.zip
        sha256: 7e1e8d69654941b7b7df84ee74c5f7fb09cce7d5496947fb7bf16b55ff427d10
        strip-components: 1
        only-arches: [aarch64]

  - name: bitwarden-cli
    buildsystem: simple
    build-commands:
      - install -D bw /app/bin/bw
    sources:
      - type: archive
        url: https://github.com/bitwarden/clients/releases/download/cli-v2026.9.1/bw-linux-2026.9.1.zip
        sha256: 84289eaf59d691f04242605112f21b00e8dba65acdedbc60dde001a2860f2097
        only-arches: [x86_64]
      - type: archive
        url: https://github.com/bitwarden/clients/releases/download/cli-v2026.9.1/bw-linux-arm64-2026.9.1.zip
        sha256: c451c773378a6f1f041ea26568a897b285a8656bee16a16e4914ce9e40fb7c79
        only-arches: [aarch64]

  - name: vte
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Dgtk3=false
      - -Dgtk4=true
      - -Dglade=false
      - -Dgir=true
      - -Dvapi=false
      - -Dgnutls=true
      - -Dicu=true
    sources:
      - type: archive
        url: https://download.gnome.org/sources/vte/0.84/vte-0.84.1.tar.xz
        sha256: aca1caa8478aebcdbb1d67897fb3511eb7601debae6810e16a15b6fa25f31ac8

  - name: python3-dependencies
    build-options:
      build-args:
        - --share=network
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app asyncssh aiosqlite cryptography PyGObject
    sources:
      - type: shell
        commands:
          - echo "Dependencies handled via pip3"

  # Bundle Noto Sans Mono CJK SC fonts so CJK characters display correctly
  # on systems that do not have CJK monospace fonts installed.
  - name: noto-fonts-cjk
    buildsystem: simple
    build-commands:
      - install -Dm644 NotoSansMonoCJKsc-Regular.otf /app/share/fonts/noto/NotoSansMonoCJKsc-Regular.otf
      - install -Dm644 NotoSansMonoCJKsc-Bold.otf    /app/share/fonts/noto/NotoSansMonoCJKsc-Bold.otf
      - fc-cache /app/share/fonts/noto
    sources:
      - type: file
        url: https://github.com/googlefonts/noto-cjk/raw/main/Sans/Mono/NotoSansMonoCJKsc-Regular.otf
        sha256: ec04cc376b34887cedbdf84074e2e226ed2761eeabdcb9173fc1dd7bfd153ef7
        dest-filename: NotoSansMonoCJKsc-Regular.otf
      - type: file
        url: https://github.com/googlefonts/noto-cjk/raw/main/Sans/Mono/NotoSansMonoCJKsc-Bold.otf
        sha256: a452fedfc0619e43e080b7b861ce34cbd3ec4fbcea495bf8c402a5a02a5dcbdc
        dest-filename: NotoSansMonoCJKsc-Bold.otf

  - name: sentinel
    buildsystem: meson
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .venv
